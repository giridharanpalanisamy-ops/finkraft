server:
  port: ${PORT:9002}

spring:
  application:
    name: mock-asp-b
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

management:
  endpoint:
    health:
      probes:
        enabled: true

mock:
  webhook-url: ${WEBHOOK_URL:http://localhost:8085/webhooks/asp-b}
  webhook-secret: ${ASP_B_WEBHOOK_SECRET:dev-webhook-secret}
  signature-header: X-Signature
  step-delay: 500ms
  webhook-delay: 300ms
