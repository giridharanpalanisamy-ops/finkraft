server:
  port: ${PORT:8080}

spring:
  application:
    name: management-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finkraft}
    username: ${DB_USER:management}
    password: ${DB_PASSWORD:management}

finkraft:
  admin:
    api-key: ${ADMIN_API_KEY:dev-admin-key}
  bulk:
    max-rows: 1000
  invoice-handler:
    url: ${INVOICE_HANDLER_URL:http://localhost:8081}
